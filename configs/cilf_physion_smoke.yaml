seed: 23
device: auto
verbose: true
run_name: cilf_physion_smoke

model:
  llm_name: distilgpt2
  state_dim: 128
  jepa_hidden_dim: 256
  vision_pretrained: false
  dynamics_type: mlp
  ode_steps: 2
  ode_method: rk4
  ode_use_adjoint: false
  bottleneck_dim: 32
  cross_attention_heads: 2
  cross_attention_dropout: 0.0
  use_sheaf_alignment: false
  use_tropical_fusion: false
  use_object_tracking: false
  use_detector_tracks: true
  max_detector_tracks: 4
  use_relation_tokens: true

data:
  dataset_class: GeneralCausalVideoDataset
  manifest_path: data/kinetic_transfer/manifest_smoke.jsonl
  val_manifest_path: data/kinetic_transfer/manifest_smoke.jsonl
  tracks_dir: data/kinetic_transfer/tracks
  max_tracks: 4
  vocab_mode: full
  num_frames: 4
  image_size: 64
  fps: 8
  max_prompt_length: 24

training:
  stage: cilf_fusion
  checkpoint_path: null
  output_dir: runs/cilf_physion_smoke
  batch_size: 2
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  max_steps: 10
  log_every: 2
  save_every: 100
  val_every: 100
  alpha_warmup_steps: 5

loss:
  margin: 0.2
  lambda_ce: 1.0
  lambda_energy: 0.3
  lambda_variance: 0.02
  lambda_alpha_warmup: 0.05
  lambda_h_causal: 0.01
  lambda_alignment: 0.1
  lambda_obstruction: 0.0
  alignment_temperature: 0.07
  use_trajectory_energy: true
  semantic_smoothing_epsilon: 0.0
  semantic_neighbor_count: 0
  lambda_object_consistency: 0.1
  lambda_object_dynamics: 0.3
  object_consistency_temperature: 0.1
  object_margin: 0.2
  lambda_transition: 0.2
  transition_temperature: 0.1
