seed: 23
device: auto
verbose: true
run_name: cilf_physion_detector_tracks

model:
  llm_name: distilgpt2
  state_dim: 256
  jepa_hidden_dim: 512
  vision_pretrained: true
  # Local copy from `scripts/setup_models_brew.sh` (brew install hf). Hub id used if missing.
  vision_model_name: models/siglip-base-patch16-224
  dynamics_type: ode
  ode_steps: 4
  ode_method: rk4
  ode_use_adjoint: true
  bottleneck_dim: 64
  cross_attention_heads: 4
  cross_attention_dropout: 0.0
  use_sheaf_alignment: true
  sheaf_threshold: 5.0
  use_tropical_fusion: true
  # Per-object path: prefer YOLO/ByteTrack precomputed tracks. Slot attention is
  # kept on as a soft fallback for clips that come without detections.
  use_object_tracking: true
  num_object_slots: 4
  slot_iters: 2
  use_relation_tokens: true
  use_detector_tracks: true
  max_detector_tracks: 6

data:
  dataset_class: GeneralCausalVideoDataset
  manifest_path: data/kinetic_transfer/manifest_kinetic_train.jsonl
  val_manifest_path: data/kinetic_transfer/manifest_kinetic_val.jsonl
  tracks_dir: data/kinetic_transfer/tracks
  max_tracks: 6
  vocab_mode: full
  num_frames: 8
  image_size: 224
  fps: 8
  max_prompt_length: 48

training:
  stage: cilf_fusion
  checkpoint_path: null
  output_dir: runs/cilf_physion
  batch_size: 2
  num_workers: 0
  learning_rate: 0.0005
  weight_decay: 0.01
  grad_clip: 1.0
  max_steps: 2000
  log_every: 25
  save_every: 250
  val_every: 250
  alpha_warmup_steps: 100

loss:
  margin: 0.2
  lambda_ce: 1.0
  lambda_energy: 0.3
  lambda_variance: 0.02
  lambda_alpha_warmup: 0.05
  lambda_h_causal: 0.01
  lambda_alignment: 0.1
  lambda_obstruction: 0.1
  alignment_temperature: 0.07
  use_trajectory_energy: true
  semantic_smoothing_epsilon: 0.1
  semantic_neighbor_count: 24
  lambda_object_consistency: 0.1
  lambda_object_dynamics: 0.3
  object_consistency_temperature: 0.1
  object_margin: 0.2
  lambda_transition: 0.2
  transition_temperature: 0.1
